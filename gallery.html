<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Suhaib Khan Photography</title>
  <meta name="description" content="Landscape photography gallery by Suhaib Khan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script type="module" src="/src/pages/gallery.js"></script>
</head>
<body class="page-gallery">
  <header class="site-header site-header--solid">
    <div class="site-header__left">
      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" aria-label="Primary">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
        </ul>
      </nav>
    </div>

    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Suhaib Khan Photography" width="180" height="75">
    </a>

    <a href="https://instagram.com/suhaib_s_khan" class="site-instagram" target="_blank" rel="noopener" aria-label="Follow me on Instagram">
      <span class="site-instagram__text">Follow <em>me</em></span>
      <span class="site-instagram__glyph" aria-hidden="true">
        <svg class="site-instagram__icon site-instagram__icon--outline" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <svg class="site-instagram__icon site-instagram__icon--fill" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M17 2H7a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h10a5 5 0 0 0 5-5V7a5 5 0 0 0-5-5Zm-5 15.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11Zm0-8.8a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6ZM17.8 7.3a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z"/>
        </svg>
      </span>
    </a>

    <div class="nav-overlay"></div>
  </header>

  <main class="gallery-page">
    <section class="gallery-intro" id="gallery-intro">
      <div class="gallery-intro__inner">
        <div class="gallery-intro__kicker">
          <span class="gallery-intro__rule" aria-hidden="true"></span>
          <span class="gallery-intro__kicker-text" id="gallery-kicker">The Collection</span>
          <span class="gallery-intro__kicker-sep" aria-hidden="true">·</span>
          <span class="gallery-intro__kicker-count" id="gallery-count" aria-hidden="true">—</span>
          <span class="gallery-intro__kicker-count-label" id="gallery-count-label">Photographs</span>
          <span class="gallery-intro__rule" aria-hidden="true"></span>
        </div>
        <h1 class="gallery-intro__title" id="gallery-title">Gallery</h1>
        <p class="gallery-intro__lede" id="gallery-lede">A wandering collection of frames.</p>
      </div>
    </section>

    <div class="gallery-bar" id="gallery-bar">
      <div class="gallery-bar__inner">
        <div class="gallery-bar__mode" id="gallery-mode" role="tablist" aria-label="Filter mode"></div>
        <div class="gallery-bar__divider" aria-hidden="true"></div>
        <div class="gallery-bar__pills-wrap">
          <div class="gallery-bar__pills" id="gallery-pills" role="tablist"></div>
        </div>
      </div>
    </div>

    <section class="gallery">
      <div class="masonry-grid">
        <!-- Gallery items injected by JS -->
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lightbox__topbar">
      <div class="lightbox__counter" aria-live="polite">
        <span class="lightbox__counter-current">01</span>
        <span class="lightbox__counter-sep">/</span>
        <span class="lightbox__counter-total">01</span>
      </div>
      <div class="lightbox__topbar-actions">
        <button class="lightbox__theme" aria-label="Toggle dark background" aria-pressed="false">
          <span class="lightbox__btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 3 A9 9 0 0 1 12 21 Z" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <span class="lightbox__btn-label lightbox__btn-label--light">Dark</span>
          <span class="lightbox__btn-label lightbox__btn-label--dark">Light</span>
        </button>
        <button class="lightbox__maximize" aria-label="Toggle full-bleed view" aria-pressed="false">
          <span class="lightbox__btn-icon" aria-hidden="true">
            <svg class="lightbox__icon lightbox__icon--expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="4 9 4 4 9 4"/>
              <polyline points="20 9 20 4 15 4"/>
              <polyline points="4 15 4 20 9 20"/>
              <polyline points="20 15 20 20 15 20"/>
            </svg>
            <svg class="lightbox__icon lightbox__icon--collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 4 9 9 4 9"/>
              <polyline points="15 4 15 9 20 9"/>
              <polyline points="9 20 9 15 4 15"/>
              <polyline points="15 20 15 15 20 15"/>
            </svg>
          </span>
          <span class="lightbox__btn-label">View</span>
        </button>
        <button class="lightbox__close" aria-label="Close viewer">
          <span class="lightbox__btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="6" x2="18" y2="18"/>
              <line x1="18" y1="6" x2="6" y2="18"/>
            </svg>
          </span>
          <span class="lightbox__btn-label">Close</span>
        </button>
      </div>
    </div>

    <div class="lightbox__stage">
      <button class="lightbox__nav lightbox__prev" aria-label="Previous photo">
        <span aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
        </span>
      </button>

      <figure class="lightbox__frame">
        <div class="lightbox__image-wrap">
          <img class="lightbox__image" src="" alt="" />
        </div>

        <figcaption class="lightbox__panel" aria-label="Photograph details">
          <div class="lightbox__panel-inner">
            <div class="lightbox__plate">
              <span class="lightbox__plate-rule" aria-hidden="true"></span>
              <span class="lightbox__plate-text">Plate N°&nbsp;<span class="lightbox__plate-num">01</span><span class="lightbox__plate-of"> of 01</span></span>
            </div>

            <h2 class="lightbox__title">Title</h2>

            <p class="lightbox__description">Description</p>

            <div class="lightbox__meta">
              <div class="lightbox__location">
                <svg class="lightbox__loc-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 22s-7-7.5-7-13a7 7 0 0 1 14 0c0 5.5-7 13-7 13z"/>
                  <circle cx="12" cy="9" r="2.5"/>
                </svg>
                <span class="lightbox__location-text">—</span>
              </div>

              <dl class="lightbox__specs">
                <div class="lightbox__spec" data-key="camera">
                  <dt>Camera</dt>
                  <dd>—</dd>
                </div>
                <div class="lightbox__spec" data-key="focal">
                  <dt>Focal</dt>
                  <dd>—</dd>
                </div>
                <div class="lightbox__spec" data-key="aperture">
                  <dt>Aperture</dt>
                  <dd>—</dd>
                </div>
                <div class="lightbox__spec" data-key="shutter">
                  <dt>Shutter</dt>
                  <dd>—</dd>
                </div>
                <div class="lightbox__spec" data-key="iso">
                  <dt>ISO</dt>
                  <dd>—</dd>
                </div>
              </dl>

              <ul class="lightbox__tags" aria-label="Categories"></ul>
            </div>
          </div>
        </figcaption>
      </figure>

      <button class="lightbox__nav lightbox__next" aria-label="Next photo">
        <span aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </span>
      </button>
    </div>

    <div class="lightbox__hints" aria-hidden="true">
      <span><kbd>←</kbd><kbd>→</kbd> Navigate</span>
      <span><kbd>F</kbd> Full-bleed</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>

  <footer class="site-footer">
    <p>&copy; 2026 Suhaib Khan Photography. All rights reserved.</p>
  </footer>
</body>
</html>
