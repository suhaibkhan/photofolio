<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Suhaib Khan Photography</title>
  <meta name="description" content="Landscape photography gallery by Suhaib Khan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Alegreya+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script type="module" src="/src/pages/gallery.js"></script>
</head>
<body class="page-gallery">
  <header class="site-header site-header--solid">
    <div class="site-header__left">
      <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" aria-label="Primary">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html" class="active">Gallery</a></li>
        </ul>
      </nav>
    </div>

    <a href="index.html" class="logo">
      <picture>
        <source type="image/webp" srcset="images/logo.webp">
        <img src="images/logo.png" alt="Suhaib Khan Photography" width="180" height="75">
      </picture>
    </a>

    <div class="site-header__right">
      <a href="https://instagram.com/suhaib_s_khan" class="site-instagram" target="_blank" rel="noopener" aria-label="Follow me on Instagram">
        <span class="site-instagram__text">Follow <em>me</em></span>
        <span class="site-instagram__glyph" aria-hidden="true">
          <svg class="site-instagram__icon site-instagram__icon--outline" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <svg class="site-instagram__icon site-instagram__icon--fill" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17 2H7a5 5 0 0 0-5 5v10a5 5 0 0 0 5 5h10a5 5 0 0 0 5-5V7a5 5 0 0 0-5-5Zm-5 15.5a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11Zm0-8.8a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6ZM17.8 7.3a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z"/>
          </svg>
        </span>
      </a>
    </div>

    <div class="nav-overlay"></div>
  </header>

  <main class="gallery-page">
    <section class="gallery-intro" id="gallery-intro">
      <div class="gallery-intro__inner">
        <div class="gallery-intro__kicker">
          <span class="gallery-intro__rule" aria-hidden="true"></span>
          <span class="gallery-intro__kicker-text" id="gallery-kicker">The Collection</span>
          <span class="gallery-intro__kicker-sep" aria-hidden="true">·</span>
          <span class="gallery-intro__kicker-count" id="gallery-count" aria-hidden="true">—</span>
          <span class="gallery-intro__kicker-count-label" id="gallery-count-label">Photographs</span>
          <span class="gallery-intro__rule" aria-hidden="true"></span>
        </div>
        <h1 class="gallery-intro__title" id="gallery-title">Gallery</h1>
        <p class="gallery-intro__lede" id="gallery-lede">A wandering collection of frames.</p>
      </div>
    </section>

    <div class="gallery-bar" id="gallery-bar">
      <div class="gallery-bar__inner">
        <div class="gallery-bar__mode" id="gallery-mode" role="tablist" aria-label="Filter mode"></div>
        <div class="gallery-bar__divider" aria-hidden="true"></div>
        <div class="gallery-bar__pills-wrap">
          <div class="gallery-bar__pills" id="gallery-pills" role="tablist"></div>
        </div>
      </div>
    </div>

    <section class="gallery">
      <div class="masonry-grid">
        <!-- Gallery items injected by JS -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="https://instagram.com/suhaib_s_khan" class="site-footer__follow" target="_blank" rel="noopener" aria-label="Follow on Instagram">
        <svg class="site-footer__follow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="18" height="18">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span class="site-footer__follow-text">Follow on Instagram</span>
      </a>
      <a href="index.html" class="site-footer__logo" aria-label="Suhaib Khan Photography — home">
        <picture>
          <source type="image/webp" srcset="images/logo.webp">
          <img src="images/logo.png" alt="Suhaib Khan Photography" width="120" height="50">
        </picture>
      </a>
      <p class="site-footer__copy">&copy; 2026 Suhaib Khan Photography &mdash; All rights reserved.</p>
    </div>
  </footer>

  <button class="back-to-top" aria-label="Back to top">
    <svg class="back-to-top__ring" viewBox="0 0 52 52" aria-hidden="true">
      <circle class="back-to-top__ring-track" cx="26" cy="26" r="23"/>
      <circle class="back-to-top__ring-fill" cx="26" cy="26" r="23"/>
    </svg>
    <svg class="back-to-top__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="22" height="22">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>
</body>
</html>
